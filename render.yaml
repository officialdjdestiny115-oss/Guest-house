services:
  - type: web
    name: guest-house
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py create_admin && python manage.py collectstatic --noinput"
    startCommand: "gunicorn guesthouse_system.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
