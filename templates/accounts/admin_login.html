{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Admin access</h1>
    <p>Sign in with your admin credentials to manage room bookings and availability.</p>
    <p class="small-note">Admin login URL: <strong>/admin-login/</strong></p>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Admin Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button class="btn" type="submit">Sign In</button>
    </form>
    <div class="page-actions" style="margin-top: 18px; justify-content: center; display: flex; gap: 10px; flex-wrap: wrap;">
        <a class="btn secondary" href="{% url 'login' %}">Guest Login</a>
        <a class="btn secondary" href="{% url 'register' %}">Guest Register</a>
    </div>
</div>
{% endblock %}
